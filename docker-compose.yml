services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - hf_cache:/app/.cache/huggingface   # keep the embedding model between restarts
  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on: [backend]
volumes:
  hf_cache:
